[project]
name = "uebalab"
version = "1.0.0"
description = "User and entity behavior analytics on 90 days of synthetic security logs: per-user and peer baselines, five detectors, risk scoring with decay and HR context, case building, and an evaluation against planted scenarios."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
uebalab = "uebalab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uebalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
